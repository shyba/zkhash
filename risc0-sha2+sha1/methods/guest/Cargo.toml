[package]
name = "hasher"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
risc0-zkvm = { version = "^2.1.0", default-features = false, features = ['std'] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha1 = { version = "=0.10.5", default-features = false }
sha2 = { version = "=0.10.8", default-features = false }

[patch.crates-io]
sha2 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha2-v0.10.8" }
sha1 = { git = "https://github.com/risc0/RustCrypto-hashes", tag = "sha1-v0.10.5" }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
opt-level = 3
