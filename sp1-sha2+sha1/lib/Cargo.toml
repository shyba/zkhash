[package]
name = "hash-lib"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "sha2-v0.10.8" }
sha1 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha1", tag = "sha1-v0.10.6" }
serde = { version = "1.0", features = ["derive"] }
alloy-sol-types = "1.0"
